 
<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <title>shaders op plane</title>
   <meta name="description" content="shaders op plane">
   <script src="../lib/aframe-v1.6.0.min.js"></script>
<body>
 
  <script>
  AFRAME.registerShader('VRcirkels', { 
     schema: { 
       opacity: { is: 'uniform', default: 0.5 }, 
       d1a: { is: 'uniform', default: 0.25 }, 
       d1b: { is: 'uniform', default: 0.344 }, 
       d2a: { is: 'uniform', default: 0.6 }, 
       d2b: { is: 'uniform', default: 0.8 }, 
       snelh: { is: 'uniform', default: 0.0001}, 
       time:  {type: 'time', is: 'uniform'} 
     }, 
 
fragmentShader:` 
   varying vec3 vUv; 
   uniform float d1a; uniform float d1b; 
   uniform float d2a; uniform float d2b; 
   uniform float opacity; 
   uniform float snelh; 
   uniform float time; 
   float pi = 3.14159265359; 
 
   vec3 palette(float t) { 
   vec3 a = vec3(0.5,0.5,0.5); 
   vec3 b = vec3(0.5,0.5,0.5); 
   vec3 c = vec3(0.5,1.0,1.0); 
   vec3 d = vec3(0.263,0416,0.557); 
   return a + b*tan(2.*pi*(c*t+d)); 
} 
 
void main(){ 
   float time = time * snelh; 
   gl_FragColor.a = opacity; 
   float d1 = length(abs(vUv.xy)-d1a) - length(abs(vUv.xy)-d1b); 
   float d2 = length(abs(vUv.xy)-d2a) / length(abs(vUv.xy)-d2b); 
 
   vec3 col = palette(d1*sin(time/5.512)*8.); 
   float pct = fract(d2*sin(time/5.512)*8.); 
   gl_FragColor = pct+vec4(col,opacity); 
}`, 
 
vertexShader:` 
   varying vec3 vUv; 
   void main() { 
   vUv = position; 
   vec4 modelViewPosition = modelViewMatrix * vec4(position, 1.); 
   gl_Position = projectionMatrix * modelViewPosition;}` 
}); 
 </script> 
 
  <a-scene> 
    <a-assets> 
   <img id ="wolken" src="../assets/wolken_equirect.jpg"> 
  </a-assets> 
<a-sky src="#wolken"></a-sky> 
  <a-entity id="rig" 
     movement-controls position="0 -1.6 0.1"> 
      <a-entity 
                camera position="0 1.6 0.1" 
    look-controls wasd-controls="acceleration:5"> 
    </a-entity> 
 </a-entity> 
 
 <a-entity 
     geometry="primitive: plane; height: 2.0; width: 2.0" 
     position="-1.0 0 -2.0" 
     material="shader: VRcirkels; opacity: 0.2; side: double; snelh: 0.0002; 
     d1a: 0.25; d1b: 0.344; d2a: 0.6; d2b: 0.8" 
     animation="property: rotation; from: 0 0 0; to: 0 360 0; easing: easeInOutSine; 
     dir: alternate; loop: true; dur: 20000;"> 
  </a-entity> 
 
  <a-entity 
      geometry="primitive: plane; height: 2.0; width: 2.0" 
      position="-1.0 0 -2.0" 
      material="shader: VRcirkels; opacity: 0.2; side: double; snelh: 0.0002; 
      d1a: 0.15; d1b: 0.344; d2a: 0.8; d2b: 0.6" 
      animation="property: rotation; from: 0 90 0; to: 0 450 0; easing: easeInOutSine; 
      dir: alternate; loop: true; dur: 20000;"> 
  </a-entity> 
 
  <a-entity 
      geometry="primitive: plane; height: 2.0; width: 2.0" 
      position="1.0 0 -2.0" 
      material="shader: VRcirkels; opacity: 0.2; side: double; snelh: 0.0002; 
      d1a: 0.25; d1b: 0.344; d2a: 0.6; d2b: 0.8" 
      animation="property: rotation; from: 0 360 0; to: 0 0 0; easing: easeInOutSine; 
      dir: alternate; loop: true; dur: 20000;"> 
  </a-entity> 
 
  <a-entity 
      geometry="primitive: plane; height: 2.0; width: 2.0" 
      position="1.0 0 -2.0" 
      material="shader: VRcirkels; opacity: 0.2; side: double; snelh: 0.0002; 
      d1a: 0.15; d1b: 0.344; d2a: 0.8; d2b: 0.6" 
      animation="property: rotation; from: 0 450 0; to: 0 90 0; easing: easeInOutSine; 
      dir: alternate; loop: true; dur: 20000;"> 
   </a-entity>
</a-scene>
 
    </body> 
</html>
