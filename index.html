<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fractalfantasie met bogen</title>
  <meta name="description" content="Fractalfantasie met bogen">
  <script src="../lib/aframe-v1.6.0.min.js"></script>
</head>
<body>
  <script>
    AFRAME.registerComponent('background-reflection-ball', {
      schema: {
        src: { type: 'asset', default: '../assets/fractalfantasie_bogen2.jpg' },
        radius: { type: 'number', default: 10 },
        detail: { type: 'int', default: 3 }
      },

      init: function () {
        const { src, radius, detail } = this.data;
        const safeRadius = Math.max(0.1, radius);
        const safeDetail = Math.max(0, Math.min(5, detail));

        this.sceneObject = this.el.sceneEl.object3D;
        this.previousBackground = this.sceneObject.background;

        this.texture = new THREE.TextureLoader().load(
          src,
          undefined,
          undefined,
          (error) => console.error(`Could not load background texture: ${src}`, error)
        );
        this.texture.mapping = THREE.EquirectangularReflectionMapping;
        this.texture.colorSpace = THREE.SRGBColorSpace;
        this.sceneObject.background = this.texture;

        this.geometry = new THREE.IcosahedronGeometry(safeRadius, safeDetail);
        this.material = new THREE.MeshBasicMaterial({
          envMap: this.texture,
          side: THREE.DoubleSide
        });

        this.el.setObject3D(
          'mesh',
          new THREE.Mesh(this.geometry, this.material)
        );
      },

      remove: function () {
        this.el.removeObject3D('mesh');

        this.geometry.dispose();
        this.material.dispose();
        this.texture.dispose();

        if (this.sceneObject.background === this.texture) {
          this.sceneObject.background = this.previousBackground;
        }
      }
    });
  </script>

  <a-scene>
    <a-entity
      background-reflection-ball="radius: 10; detail: 3"
      animation="property: rotation; from: 0 0 0; to: 360 0 360; loop: true; easing: linear; dur: 30000">
    </a-entity>

    <a-entity id="rig" position="0 -1.6 12" wasd-controls="acceleration: 200">
      <a-entity camera position="0 1.6 6" look-controls></a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
